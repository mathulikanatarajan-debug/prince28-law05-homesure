
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homesure-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
        run: uv run poe migrate

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook secret is missing!"
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment triggered successfully."

      - name: Wait for deployment
        run: sleep 60

      - name: Smoke test live API
        run: |
          HEALTH_URL="https://homesure-api.onrender.com/health"

          for attempt in $(seq 1 40); do
            echo "Checking HomeSure API: attempt $attempt/40"

            response=$(curl --fail --silent \
              --show-error "$HEALTH_URL") || response=""

            if echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "HomeSure API is healthy!"
              echo "$response"
              exit 0
            fi

            echo "API is not ready yet. Waiting 10 seconds..."
            sleep 10
          done

          echo "HomeSure health check failed!"
          exit 1
