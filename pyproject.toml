
[project]
name = "homesure"
version = "0.1.0"
description = "HomeSure production FastAPI service"
readme = "README.md"
authors = [
    { name = "Mathulika", email = "mathulikanatarajan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Harmless notice from newer Starlette versions; hide it so real warnings stand out.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
